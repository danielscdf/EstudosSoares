<script>
    let itensCategoria = {};
    let cesta = [];

    document.getElementById("categoria").addEventListener("change", async function () {
        const categoria = this.value;
        const resp = await fetch(`/itens?categoria=${categoria}`);
        const data = await resp.json();
        itensCategoria[categoria] = data;
        const itemSelect = document.getElementById("item");
        itemSelect.innerHTML = "";
        data.forEach(i => {
            const opt = document.createElement("option");
            opt.textContent = i.descricao;
            opt.value = JSON.stringify(i);
            itemSelect.appendChild(opt);
        });
    });

    function adicionarItem() {
        const itemData = JSON.parse(document.getElementById("item").value);
        const qtd = parseInt(document.getElementById("quantidade").value);
        cesta.push({ item: itemData, qtd });
        renderTabela();
    }

    function removerItem(index) {
        cesta.splice(index, 1);
        renderTabela();
    }

    function renderTabela() {
        const body = document.getElementById("cesta-body");
        body.innerHTML = "";
        let total = 0;
        cesta.forEach((linha, idx) => {
            const subtotal = linha.qtd * linha.item.valor;
            total += subtotal;
            body.innerHTML += `
                <tr>
                    <td>${linha.item.descricao}</td>
                    <td>${linha.qtd}</td>
                    <td>R$ ${linha.item.valor.toFixed(2)}</td>
                    <td>R$ ${subtotal.toFixed(2)}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="removerItem(${idx})">Remover</button></td>
                </tr>`;
        });
        document.getElementById("total").textContent = total.toFixed(2);
    }
</script>
